<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>di-drop · Standort senden</title>
  <style>
    :root { --accent: #c8102e; --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --ok: #1f8a4c; --warn: #b86e00; }
    @media (prefers-color-scheme: dark) { :root { --accent: #ff4d5e; --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --ok: #4cc27e; --warn: #ffb23e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: max(24px, env(safe-area-inset-top)) 20px 32px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-weight: 700; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 18px; }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    .big { display: block; width: 100%; padding: 18px; margin-top: 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 700;
      background: var(--accent); color: #fff; }
    .big:disabled { opacity: .5; }
    .secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
    .state-ok h1 { color: var(--ok); }
    .state-error h1 { color: var(--accent); }
    .live { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; }
    .live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .facts { margin-top: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
    .spinner { width: 34px; height: 34px; margin: 8px auto 16px; border-radius: 50%; border: 4px solid rgba(128,128,128,.25); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    progress { width: 100%; height: 8px; margin: 12px 0 4px; accent-color: var(--accent); }
    .received { display: block; width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; margin-bottom: 16px; background: rgba(128,128,128,.15); }
    /* Remote control (training mode) */
    :root { --training: #e8730c; }
    .remote-mode header .logo { background: var(--training); }
    .state-remote { text-align: left; }
    .remote-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .badge { padding: 2px 8px; border-radius: 99px; background: var(--training); color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .remote-notice { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(232,115,12,.15); color: var(--training); font-size: 15px; }
    .remote-clock { text-align: center; margin: 4px 0 10px; }
    #clock { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--training); line-height: 1.1; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .row .btn { flex: 1 1 auto; min-width: 0; }
    .btn { padding: 14px 10px; border-radius: 12px; border: 1.5px solid rgba(128,128,128,.35); background: transparent; color: var(--text); font: inherit; font-weight: 600; }
    .btn.primary { background: var(--training); border-color: var(--training); color: #fff; }
    .btn:disabled { opacity: .45; }
    .remote-next { margin-top: 16px; padding: 14px; border-radius: 14px; border: 2px solid var(--training); }
    .remote-next .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--training); margin-bottom: 4px; }
    .state-remote h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
    .remote-device { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 12px; }
    .remote-device.on { background: rgba(232,115,12,.15); }
    .remote-device .btn { flex: none; padding: 10px 14px; }
    footer { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; max-width: 420px; }
  </style>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><span class="logo">⌖</span> di-drop</header>
  <main id="view"><div class="spinner"></div><p>Wird geladen …</p></main>
  <footer>Dein Standort wird verschlüsselt direkt an di-drop übertragen. Der Vermittlungsserver kann ihn nicht lesen und speichert nichts.</footer>
</body>
</html>
