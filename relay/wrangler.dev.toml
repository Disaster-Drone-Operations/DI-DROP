# Only for local testing (wrangler dev). The real deployment is done by the app itself
# via the Cloudflare API – without wrangler on the user's machine.
name = "di-drop-relay-dev"
main = ".dev/worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "RelaySession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]
