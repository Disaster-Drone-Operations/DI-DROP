# Checks on every push that di-drop compiles on macOS and Windows and the tests pass –
# without installers and without a release (Windows-specific code isn't compiled on the Mac).
name: Check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    name: ${{ matrix.platform == 'windows-latest' && 'Windows' || 'macOS' }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run build          # UI (embedded into the app)

      - name: Build and test Rust
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo test --lib
