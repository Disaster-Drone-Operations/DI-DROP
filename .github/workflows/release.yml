# Builds di-drop for macOS (Apple Silicon + Intel) and Windows and creates a draft release.
# Trigger: a tag "v1.2.3" (see docs/release.md) or manually under Actions → "Release".
# The release contains the installers and latest.json for auto-updating installed apps.
# The release body is shown to users, so it stays German.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            label: macOS
          - platform: windows-latest
            args: ''
            label: Windows
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Tag and version must match – otherwise the build ends up in the old version's release
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in src-tauri/tauri.conf.json. Run 'node script/bump_version.mjs ${GITHUB_REF_NAME#v}' and commit first."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: one app for Apple Silicon and Intel
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing (key: ~/.tauri/di-drop-updater.key, see docs/release.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: di-drop __VERSION__
          releaseBody: |
            Installieren:
            - **macOS:** `di-drop_…_universal.dmg` öffnen und di-drop in „Programme“ ziehen.
              Beim ersten Start: Rechtsklick auf di-drop → „Öffnen“ (die App ist noch nicht von Apple signiert).
            - **Windows:** `di-drop_…_x64-setup.exe` ausführen. Erscheint „Windows hat den PC geschützt“:
              „Weitere Informationen“ → „Trotzdem ausführen“ (die App ist noch nicht signiert).

            Bereits installierte Versionen aktualisieren sich von selbst.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
