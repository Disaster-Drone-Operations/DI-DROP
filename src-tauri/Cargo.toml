[package]
name = "di-drop"
version = "0.1.0"
description = "Disaster Drone Operator – Werkzeug für Drone Operator im Katastrophenschutz"
edition = "2021"

[lib]
name = "di_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.0"
blake3 = "1.8.7"
kamadak-exif = "0.6.1"
jpeg-decoder = "0.3.2"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rayon = "1.12.0"
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio = { version = "1", features = ["time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Abhängigkeiten auch im Debug-Build optimieren – Bild-Dekodierung wäre sonst sehr langsam
[profile.dev.package."*"]
opt-level = 3
