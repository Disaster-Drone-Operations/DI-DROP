[package]
name = "di-drop"
version = "0.6.2"
description = "Disaster Drone Operator – Werkzeug für Drone Operator im Katastrophenschutz"
edition = "2021"
license = "MIT"
default-run = "di-drop"

[lib]
name = "di_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.0"
blake3 = "1.8.7"
kamadak-exif = "0.6.1"
jpeg-decoder = "0.3.2"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rayon = "1.12.0"
reqwest = { version = "0.13", features = ["json", "multipart", "form", "stream"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "rt"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
roxmltree = "0.20"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Started again (e.g. by Windows AutoPlay for a memory card) → the running di-drop comes to the front
tauri-plugin-single-instance = "2"
dji-log-parser = "0.5.7"
mtp-rs = "0.33"
trash = "5"

# Memory cards: is the card write-protected (lock switch)? – src/sdcard.rs
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }

# Optimize dependencies in debug builds too – image decoding would be very slow otherwise
[profile.dev.package."*"]
opt-level = 3
